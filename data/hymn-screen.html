html,body{margin:0;height:100%;overflow:hidden}
body{background:#000;color:#fff;cursor:none}
body.clear{background:transparent}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .7s ease}
.layer.on{opacity:1}
/* The hymn number has its own layer: it stays put while the verses dissolve, and only fades when the hymn changes */
.layer.v{padding-top:14.1vh;box-sizing:border-box}
.nl{position:absolute;left:0;right:0;top:9.5vh;text-align:center;opacity:0;transition:opacity .7s ease}
.nl.on{opacity:1}
.num{font:400 4.6vh/1 "EB Garamond",Georgia,serif;letter-spacing:.02em}
.nbh .num{font:500 4.2vh/1.1 Montserrat,Arial,sans-serif;letter-spacing:.04em}
.nbh .txt{font-family:Montserrat,Arial,"Helvetica Neue",Helvetica,sans-serif;line-height:1.35}
.box{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;padding:0 7vw 8vh;box-sizing:border-box}
.txt{font-family:Arimo,Arial,"Helvetica Neue",Helvetica,sans-serif;text-align:center;line-height:1.3;white-space:pre-line}
.chorus .txt{font-style:italic}
.qr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;font-family:Arimo,Arial,"Helvetica Neue",Helvetica,sans-serif;text-align:center}
.qr img{width:34vh;height:34vh;border-radius:1.6vh;background:#fff;padding:1.2vh;box-sizing:border-box}
.qr b{display:block;font:400 6vh/1.1 "EB Garamond",Georgia,serif}
.qr span{display:block;font-size:3.3vh;opacity:.75;margin-top:1.4vh}
body.clear .txt,body.clear .num,body.clear .nl,body.clear .qr b,body.clear .qr span{text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9)}
</style>
</head>
<body>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
if(Q.get("bg") === "none") document.body.classList.add("clear");
// Between verses: the QR code for the Soterio hymn book, or black for The New Believers Hymn Book (qr=0 or qr=1 to choose)
const BOOK = Q.get("book"), QR = Q.get("qr") === "1" || (Q.get("qr") !== "0" && BOOK !== "nbh");
let shown = null, front = null, numShown = null, numFront = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// The biggest text size (up to 4.9% of the screen height, 53px at 1080) that fits the screen
function fit(layer){
  const box = layer.querySelector(".box"), txt = layer.querySelector(".txt");
  if(!txt) return;
  let hi = innerHeight * .049, lo = innerHeight * .02;
  txt.style.fontSize = hi + "px";
  const fits = () => txt.scrollWidth <= box.clientWidth - 1 && txt.offsetHeight <= box.clientHeight * .98;
  if(fits()) return;
  for(let k = 0; k < 14; k++){
    const mid = (hi + lo) / 2;
    txt.style.fontSize = mid + "px";
    if(fits()) lo = mid; else hi = mid;
  }
  txt.style.fontSize = lo + "px";
}

// Fades from one layer to the next: the old one out, the new one (or nothing) in
function swap(old, el){
  if(el){ document.body.appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on"))); }
  if(old){ old.classList.remove("on"); setTimeout(() => old.remove(), 800); }
}
// The hymn number: unchanged while the verses change, faded only to another hymn's number or to nothing
function showNum(d){
  const key = d ? (d.book || "soterio") + "|" + d.num : null;
  if(key === numShown) return;
  numShown = key;
  let el = null;
  if(d){
    el = document.createElement("div");
    el.className = "nl" + (d.book === "nbh" ? " nbh" : "");
    el.innerHTML = `<div class="num">${esc(d.num)}</div>`;
  }
  const old = numFront; numFront = el; swap(old, el);
}
// Dissolves to the new verse. With no verse: to the QR code that opens the hymn book on people's phones.
function show(d){
  if(d && d.key && BOOK && (d.book || "soterio") !== BOOK) d = null;   // the other hymn book's verse
  const verse = d && d.key;
  showNum(verse ? d : null);
  const key = verse ? d.key + "|" + d.text : QR ? "qr" : null;
  if(key === shown) return;
  shown = key;
  const old = front;
  front = null;
  if(key){
    const el = document.createElement("div");
    el.className = "layer" + (verse ? " v" : "") + (verse && d.chorus ? " chorus" : "") + (verse && d.book === "nbh" ? " nbh" : "");
    el.innerHTML = verse ? `<div class="box"><div class="txt">${esc(d.text)}</div></div>`
      : `<div class="qr"><img src="/hymn-qr.svg" alt=""><div><b>Follow along on your phone</b><span>Scan for The Soterio Hymn Collection</span></div></div>`;
    document.body.appendChild(el);
    if(verse) fit(el);
    front = el;
  }
  swap(old, front);
}

addEventListener("resize", () => { if(front) fit(front); });
if(document.fonts) document.fonts.ready.then(() => { if(front) fit(front); });

function connect(){
  const es = new EventSource("/api/hymn-events");
  es.addEventListener("hymn", e => { let d = null; try{ d = JSON.parse(e.data); }catch(x){} show(d); });
  es.onerror = () => { if(es.readyState === 2){ es.close(); setTimeout(connect, 2000); } };   // otherwise the browser retries by itself
}
show(null);
connect();
</script>
</body>
