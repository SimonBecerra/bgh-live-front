<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hymn verses</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400;1,400&family=EB+Garamond&display=swap">
<style>
/* BGH LIVE Front: the hymn verse on the projector. Add it in OBS as a Browser Source:
     http://127.0.0.1:8650/hymn-screen            white text on black, sized 1920 x 1080
     http://127.0.0.1:8650/hymn-screen?bg=none    no background, to put the words over a camera
     add &qr=0 (or ?qr=0) to show nothing between verses, instead of the QR code for the hymn book
   Phones in the hymn book's Presenter Mode choose what's shown. */
html,body{margin:0;height:100%;overflow:hidden}
body{background:#000;color:#fff;cursor:none}
body.clear{background:transparent}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity .7s ease}
.layer.on{opacity:1}
.num{flex:none;margin-top:9.5vh;font:400 4.6vh/1 "EB Garamond",Georgia,serif;letter-spacing:.02em}
.box{flex:1;display:flex;align-items:center;justify-content:center;width:100%;min-height:0;padding:0 7vw 8vh;box-sizing:border-box}
.txt{font-family:Arimo,Arial,"Helvetica Neue",Helvetica,sans-serif;text-align:center;line-height:1.3;white-space:pre-line}
.chorus .txt{font-style:italic}
.qr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.2vh;font-family:Arimo,Arial,"Helvetica Neue",Helvetica,sans-serif;text-align:center}
.qr img{width:34vh;height:34vh;border-radius:1.6vh;background:#fff;padding:1.2vh;box-sizing:border-box}
.qr b{display:block;font:400 6vh/1.1 "EB Garamond",Georgia,serif}
.qr span{display:block;font-size:3.3vh;opacity:.75;margin-top:1.4vh}
body.clear .txt,body.clear .num,body.clear .qr b,body.clear .qr span{text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9)}
</style>
</head>
<body>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
if(Q.get("bg") === "none") document.body.classList.add("clear");
const QR = Q.get("qr") !== "0";
let shown = null, front = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// The biggest text size (up to 6.4% of the screen height) that fits the screen
function fit(layer){
  const box = layer.querySelector(".box"), txt = layer.querySelector(".txt");
  if(!txt) return;
  let hi = innerHeight * .064, lo = innerHeight * .02;
  txt.style.fontSize = hi + "px";
  const fits = () => txt.scrollWidth <= box.clientWidth - 1 && txt.offsetHeight <= box.clientHeight * .98;
  if(fits()) return;
  for(let k = 0; k < 14; k++){
    const mid = (hi + lo) / 2;
    txt.style.fontSize = mid + "px";
    if(fits()) lo = mid; else hi = mid;
  }
  txt.style.fontSize = lo + "px";
}

// Dissolves to the new verse. With no verse: to the QR code that opens the hymn book on people's phones.
function show(d){
  const verse = d && d.key;
  const key = verse ? d.key + "|" + d.text : QR ? "qr" : null;
  if(key === shown) return;
  shown = key;
  const old = front;
  front = null;
  if(key){
    const el = document.createElement("div");
    el.className = "layer" + (verse && d.chorus ? " chorus" : "");
    el.innerHTML = verse ? `<div class="num">${esc(d.num)}</div><div class="box"><div class="txt">${esc(d.text)}</div></div>`
      : `<div class="qr"><img src="/hymn-qr.svg" alt=""><div><b>Follow along on your phone</b><span>Scan for The Soterio Hymn Collection</span></div></div>`;
    document.body.appendChild(el);
    if(verse) fit(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("on")));
    front = el;
  }
  if(old){
    old.classList.remove("on");
    setTimeout(() => old.remove(), 800);
  }
}

addEventListener("resize", () => { if(front) fit(front); });
if(document.fonts) document.fonts.ready.then(() => { if(front) fit(front); });

function connect(){
  const es = new EventSource("/api/hymn-events");
  es.addEventListener("hymn", e => { let d = null; try{ d = JSON.parse(e.data); }catch(x){} show(d); });
  es.onerror = () => { if(es.readyState === 2){ es.close(); setTimeout(connect, 2000); } };   // otherwise the browser retries by itself
}
show(null);
connect();
</script>
</body>
</html>
