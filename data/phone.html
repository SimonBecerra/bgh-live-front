<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BGH Front Remote">
<meta name="application-name" content="BGH Front Remote">
<title>BGH Front Remote</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Spectral:wght@700&display=swap">
<style>
:root{
  --bg:#0B1418; --panel:#101e24; --panel-2:#16282f; --line:#213740; --line-2:#2e4854;
  --fg:#f5f2ea; --muted:#a8bcc4; --dim:#6f8f9a;
  --accent:#F5B700; --accent-ink:#132932; --accent-soft:rgba(245,183,0,.16);
  --rec:#ec4c52; --rec-soft:rgba(236,76,82,.18);
  --ok:#3ccf7e; --ok-soft:rgba(60,207,126,.16);
  --warn:#ff8a3d; --warn-soft:rgba(255,138,61,.16);
  --f-ui:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-brand:"Spectral",Georgia,"Times New Roman",serif;
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tn{font-variant-numeric:tabular-nums}

.stage{display:flex;justify-content:center;gap:28px;height:100%;box-sizing:border-box;padding-block:8px 10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.phone{position:relative;width:100%;max-width:430px;min-width:0;height:100%;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}

/* Header */
.top{display:flex;flex-direction:column;gap:8px;flex:none}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{margin:0;display:flex;align-items:baseline;gap:6px;font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.brand{align-items:center}
.brand b{font-family:var(--f-brand);font-size:18px;letter-spacing:.02em;color:var(--accent)}
.brand .logo{width:auto;height:28px;flex:none;display:block}
.pair .brand{flex-direction:column;gap:10px;font-size:15px}
.top .brand .logo{display:none}
.pair .brand .logo{height:84px}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0;flex:1}
.conn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.conn.lost .dot{background:var(--warn);animation:blink 1s infinite}
/* Connected: the blend icon in green */
.conn svg.blend{width:20px;height:20px;color:var(--ok)}
.top .conn{justify-content:flex-end}
.conn-btn{display:grid;place-items:center;width:36px;height:36px;margin:-8px;padding:0;border:0;border-radius:50%;background:none}
.conn-btn:active{background:var(--ok-soft)}
@keyframes blink{50%{opacity:.25}}
.gear[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.gear{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted);flex:none}
/* Safari gives buttons padding of its own: without this the icon sits off-centre */
.gear,.conn-btn{padding:0;box-sizing:border-box;line-height:0;-webkit-appearance:none;appearance:none}
.gear svg.i,.conn-btn svg.i{display:block;margin:auto}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--warn-soft);border:1px solid var(--warn);font-size:13px;line-height:1.4;flex:none}
.banner svg.i{color:var(--warn)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel-2);font-weight:600;font-size:16px}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.quiet{background:transparent}
.off .ctl{opacity:.4;pointer-events:none}

/* Slides: the biggest controls, since they're pressed most */
.slides{flex:none;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.sl-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sl-h b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-h .tn{font-size:13px;color:var(--muted);flex:none}
.sl-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.sl-nav .btn{min-height:84px;font-size:18px}
.sl-nav svg.i{width:30px;height:30px}
.sl-dots{display:flex;gap:4px}
.sl-dots i{flex:1;height:4px;border-radius:2px;background:var(--line-2)}
.sl-dots i.on{background:var(--accent)}
.sl-dots i.seen{background:var(--dim)}

/* Scenes */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;flex:none}
.hint{font-size:12px;color:var(--muted)}
.scenes{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;grid-template-rows:repeat(var(--rows,3),minmax(44px,1fr))}
.sc{position:relative;display:flex;align-items:center;gap:10px;min-height:0;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--panel-2);text-align:left;font-weight:600;font-size:15px;line-height:1.2}
.sc svg.i{color:var(--muted)}
.sc.tr,.tr-open{grid-column:1 / -1}
.sc.tr > span{flex:1;display:flex;flex-direction:column;gap:2px}
.sc small{font-weight:500;font-size:12px;color:var(--muted)}
.sc.tr[aria-pressed="true"] small{color:var(--fg)}
.tr-open{display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px;padding:6px;border-radius:12px;border:2px solid var(--accent);background:var(--accent-soft);min-height:0}
.tr-head{display:flex;align-items:center;gap:8px;padding:2px 4px;border:0;background:none;font-weight:700;font-size:15px;text-align:left}
.tr-head span{flex:1}.tr-head svg.i{color:var(--accent)}.tr-head svg.i:last-child{color:var(--muted)}
.tr-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;min-height:0}
.sc.opt{justify-content:center;text-align:center;padding:6px;min-height:44px}
.sc.opt > span{display:flex;flex-direction:column;gap:2px}
.sc.armed{border-color:var(--accent);background:var(--accent-soft)}
.sc.armed svg.i{color:var(--accent)}
.sc .arm{display:block;font-size:12px;font-weight:700;color:var(--accent);animation:blink 1s ease-in-out infinite}
.sc[aria-pressed="true"]{border-color:var(--rec);background:var(--rec-soft)}
.sc[aria-pressed="true"] svg.i{color:var(--rec)}
.sc[aria-pressed="true"]::after{content:"ON";position:absolute;top:5px;right:6px;font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--rec);border-radius:5px;padding:2px 5px}

/* Projector + Record row */
.acts{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act.swap-btn{flex-direction:row;align-items:center;justify-content:center;gap:10px;color:var(--muted)}
.act.swap-btn span{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line-2)}
.act.swap-btn span svg.i{width:22px;height:22px}
.act.swap-btn span.front{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.act.swap-btn > svg.i{width:20px;height:20px}
.act.swap-btn:active:not(:disabled){transform:scale(.98)}
.act.swap-btn.armed{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);animation:swapArm .9s ease-in-out infinite}
@keyframes swapArm{50%{box-shadow:0 0 0 4px rgba(245,183,0,.35)}}
@media (prefers-reduced-motion:reduce){.act.swap-btn.armed{animation:none}}
.gear.pj-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gear.pj-btn.bounce{animation:pjBounce .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pjBounce{0%{transform:scale(1)}30%{transform:scale(1.25)}55%{transform:scale(.92)}75%{transform:scale(1.06)}100%{transform:scale(1)}}
.gear.pj-btn.nudge{border-color:var(--accent);color:var(--accent);animation:pjPulse 1.1s ease-out infinite}
@keyframes pjPulse{0%{box-shadow:0 0 0 0 rgba(245,183,0,.75);transform:scale(1)}40%{transform:scale(1.08)}70%{box-shadow:0 0 0 12px rgba(245,183,0,0);transform:scale(1)}100%{box-shadow:0 0 0 0 rgba(245,183,0,0)}}
@media (prefers-reduced-motion:reduce){.gear.pj-btn.bounce{animation:none}.gear.pj-btn.nudge{box-shadow:0 0 0 3px rgba(245,183,0,.6)}}
.act{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-height:72px;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel-2);text-align:left}
.act .t{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.act small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.act.proj[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.act.proj[aria-pressed="true"] svg.i{color:var(--accent)}
.act.rec .rdot{width:14px;height:14px;border-radius:50%;background:var(--rec);flex:none}
.act.rec[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#fff}
.act.rec[aria-pressed="true"] small{color:rgba(255,255,255,.85)}
.act.rec[aria-pressed="true"] .rdot{background:#fff;border-radius:3px;animation:blink 1.4s infinite}
.act:disabled{opacity:.45}

/* Presenter mode: the slide itself fills the phone, with what's next underneath */
.mode-chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:999px;border:1px solid var(--line-2);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:none}
.mode-chip.is-pres{border-color:var(--accent);color:var(--accent)}
button.mode-chip{height:24px;padding:0 10px;background:var(--panel);font-family:inherit}
button.mode-chip svg.i{width:14px;height:14px}
button.mode-chip:active{transform:scale(.97)}
.pres{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.pv-box{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.pv-slide{box-sizing:border-box;position:relative;width:min(100cqw, calc(100cqh * var(--ar,1.3333)));aspect-ratio:var(--ar,1.3333);max-width:100%;container-type:inline-size;border-radius:12px;overflow:hidden;border:2px solid var(--accent);background:#000;flex:none;cursor:pointer}
.pv-slide .slide .k{font-size:3.4cqw}.pv-slide .slide .h{font-size:8cqw}.pv-slide .slide .b{font-size:4.2cqw}
.pv-slide.wide .slide{padding:6% 9%}.pv-slide.wide .slide .k{font-size:2.6cqw}.pv-slide.wide .slide .h{font-size:6cqw}.pv-slide.wide .slide .b{font-size:3.2cqw}
.pv-slide .tag{background:var(--accent);color:var(--accent-ink)}
.next-up{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);flex:none}
.next-up .thumb{position:relative;aspect-ratio:var(--ar,1.3333);border-radius:6px;overflow:hidden;background:#000}
.next-up .thumb .slide{padding:8%;gap:4%}
.next-up .thumb .slide .k{font-size:6px}.next-up .thumb .slide .h{font-size:10px}.next-up .thumb .slide .b{display:none}
.next-up .nt{display:flex;flex-direction:column;gap:2px;min-width:0}
.next-up .nt b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-up .nt span{font-size:12px;color:var(--muted)}
.pres-info{display:flex;justify-content:space-between;align-items:baseline;flex:none;font-size:13px;color:var(--muted)}
.pres-info b{color:var(--fg);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pres-info{gap:10px;min-width:0;justify-content:flex-end}
.shape-chip{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:12px;color:var(--muted)}
.shape-chip i{display:block;height:12px;border:1.5px solid currentColor;border-radius:2px}
.shape-chip i.r43{width:16px}.shape-chip i.r169{width:21px}
.pres-nav{flex:none;display:grid;grid-template-columns:56px 1fr;gap:10px}
.pres-nav #slBack{background:transparent;border-color:var(--line);color:var(--muted)}
.pres-nav #slBack svg.i{width:26px;height:26px}
.pres-nav .btn{min-height:128px;font-size:20px}
.pres-nav svg.i{width:32px;height:32px}
.pres-nav #slNext{font-size:28px;font-weight:800;gap:2px;flex-direction:column}
.pres-nav #slNext .count{font-size:14px;font-weight:700;opacity:.8}
.pres-nav #slNext:disabled{opacity:1;background:var(--panel-2);border-color:var(--line-2);color:var(--muted)}
.pres-nav #slNext:disabled svg.i{opacity:.35}
.pres-nav #slNext svg.i{width:52px;height:52px;stroke-width:2.5}

/* Sideways: the slide takes the left, everything else stacks in a column on the right */
.phone.land{gap:6px}
.phone.land .top .brand b{font-size:16px}
.phone.land .top .brand .logo{height:24px}
.phone.land .gear{width:34px;height:34px}
.phone.land .pres{container-type:size;display:grid;grid-template-columns:44px auto minmax(150px,1fr);grid-template-rows:auto;align-content:center;gap:6px 12px;
  grid-template-areas:"back slide next"}
.phone.land .next-up{display:none}
.phone.land .pv-box{grid-area:slide;width:min(calc(100cqh * var(--ar,1.3333)), calc(100cqw - 44px - 150px - 24px));height:min(100cqh, calc((100cqw - 44px - 150px - 24px) / var(--ar,1.3333)))}
.phone.land .pres-info{grid-area:info}
.phone.land .next-up{grid-area:up;grid-template-columns:auto minmax(0,1fr);padding:4px 8px;gap:8px}
.phone.land .next-up .thumb{height:34px;width:auto}
.phone.land .next-up .nt{flex-direction:row;align-items:baseline;gap:8px}
.phone.land .sl-dots{grid-area:dots}
.phone.land .pres-nav{display:contents}
.phone.land #slBack{grid-area:back}
.phone.land #slNext{grid-area:next;flex-direction:column;gap:6px}
.phone.land .pres-nav .btn{min-height:0;height:100%;padding:0 8px}
.phone.land .scenes{grid-template-rows:repeat(2,minmax(40px,1fr))}
.phone.land .acts .act{min-height:56px}
/* Rotation lock on: the remote turns itself sideways on screen */
.phone.turned{position:fixed;top:0;left:0;z-index:5;max-width:none;width:100vh;width:100dvh;height:100vw;box-sizing:border-box;
  padding:max(8px,env(safe-area-inset-left,0px)) 12px;background:var(--bg);transform-origin:top left;transform:rotate(90deg) translateY(-100%)}

/* Choosing a mode */
.modes{display:grid;grid-template-columns:minmax(0,1fr);grid-auto-rows:1fr;gap:12px}
.modes .mode-card{align-content:center}
.mode-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center;padding:16px;border-radius:16px;border:2px solid var(--line-2);background:var(--panel);text-align:left}
.mode-card svg.i{grid-row:span 2;width:48px;height:48px;color:var(--accent)}
.mode-card b{font-size:24px}
.mode-card span{font-size:15px;color:var(--muted);line-height:1.4}
.pair .mode-card{min-height:140px;padding:20px 22px;gap:2px 18px;border-radius:20px;align-content:center}
.pair .modes{gap:16px}
.mode-card{box-sizing:border-box;color:inherit;text-decoration:none}
.mode-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg)}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end}
.sheet{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.sheet h3{margin:0;font-size:20px;text-wrap:balance}
.pj-menu > .btn{width:100%;justify-content:flex-start;gap:12px}
.pj-menu > .btn.quiet{justify-content:center}
.swap-icons{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--muted)}
.swap-icons span{display:grid;place-items:center;width:64px;height:64px;border-radius:16px;border:2px solid var(--line-2);background:var(--panel-2)}
.swap-icons span svg.i{width:32px;height:32px}
.swap-icons span.front{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.swap-icons > svg.i{width:28px;height:28px}
.scrim.center{align-items:center;justify-content:center;padding:16px}
.scrim.center .sheet{border-radius:20px;padding-bottom:18px;text-align:center}
.sheet p{margin:0;color:var(--muted);line-height:1.45;font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field select{min-height:48px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);padding:0 12px;font-size:15px}
.mons{display:flex;gap:12px;align-items:flex-end}
.mon-pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:12px;border:2px solid var(--line-2);background:var(--bg);font-size:12px;color:var(--muted)}
.mon-pick .shape{display:grid;place-items:center;height:54px;border-radius:5px;border:2px solid currentColor;font-weight:800;font-size:18px}
.mon-pick .shape.w{width:96px}.mon-pick .shape.n{width:72px}
.mon-pick[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.txt{min-height:48px;border-radius:10px;border:1px solid var(--line-2);background:var(--bg);padding:0 12px;font-size:16px;box-sizing:border-box;width:100%}
.screens-list{display:flex;flex-direction:column;gap:6px}
.scr-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.scr-row .shape{height:18px;border:2px solid var(--dim);border-radius:3px;flex:none}.scr-row .shape.w{width:32px}.scr-row .shape.n{width:24px}
.scr-row .nm{flex:1;min-width:0;display:flex;flex-direction:column}.scr-row small{color:var(--muted);font-size:12px}
.scr-row b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:5px}
.scr-row.hit{border-color:var(--accent);background:var(--accent-soft)}.scr-row.hit .shape{border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Pairing */
.pair{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:28px 10px;text-align:center}
.pair > *{max-width:100%}
.phone > .pair{flex:1;min-height:0;box-sizing:border-box}
.pair .code{margin-block:auto 0}
.pair .code + .err{margin-bottom:auto;padding-bottom:min(18vh,120px)}
.pair .brand{justify-content:center}
.pair .modes{width:100%}
.pair .banner{text-align:left}
.pair h2{margin:0;font-size:26px;text-wrap:balance}
.pair p{margin:0;color:var(--muted);line-height:1.5}
.code{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:260px;margin:0 auto;width:100%}
.code input{height:72px;border-radius:14px;border:1px solid var(--line-2);background:var(--panel);text-align:center;font-size:32px;font-weight:700;width:100%;box-sizing:border-box;min-width:0}
.err{color:var(--rec);font-size:14px;min-height:20px}

.toast{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;width:max-content;max-width:calc(100% - 32px);text-align:center}

/* Real-app additions */
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
.pv-slide img{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.next-up .thumb img{display:block;width:100%;height:100%;object-fit:contain}
/* Next or Back pressed: the outline dims until the new slide's picture arrives, then flashes yellow */
.pv-slide{transition:border-color .15s}
.pv-slide.waiting{border-color:var(--line-2)}
.pv-slide.waiting img{opacity:.6;transition:opacity .15s}
.pv-slide.fresh{animation:slideFresh .7s ease-out}
@keyframes slideFresh{0%{box-shadow:0 0 0 0 rgba(245,183,0,.95)}100%{box-shadow:0 0 0 16px rgba(245,183,0,0)}}
@media (prefers-reduced-motion:reduce){.pv-slide.fresh{animation:none}}
.pv-empty{position:absolute;inset:0;display:grid;place-items:center;padding:12%;box-sizing:border-box;text-align:center;color:var(--muted);font-size:15px;line-height:1.45}
.sc:disabled{opacity:.45}
/* Hymns */
.nb{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.nb .modes{gap:12px}
.nb .mode-card.book{min-height:112px}
.nb .mode-card.book b{font-size:20px;line-height:1.2}
.nb.books{justify-content:center;padding-bottom:6vh}
.nb.books .modes{flex:none}
/* The two hymn books' own logos, in the remote's yellow */
.bico{grid-row:span 2;width:72px;height:56px;background:var(--accent);-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}

.nb-q{margin:6px 0 2px;font-size:22px;text-align:center}
.nb-bar{display:flex;align-items:center;gap:10px;flex:none;min-width:0}
.nb-bk{font-family:var(--f-brand);font-size:19px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-search{flex:none}
.nb-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px}
.nb-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:left;flex:none}
.nb-row:active{background:var(--panel-2)}
.nb-n{font-family:var(--f-brand);font-size:20px;font-weight:700;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
.nb-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.nb-t b{font-size:15px;line-height:1.25}
.nb-t small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-row.live{border-color:var(--accent);background:var(--accent-soft)}
.nb-tag{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:3px 6px;border-radius:5px}
.nb-ttl{display:flex;align-items:baseline;gap:8px;min-width:0}
.nb-ttl b{font-size:18px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.nb-ttl .nb-n{font-size:22px;text-align:left}
.nb-meta{flex:none;font-size:12px;color:var(--muted);line-height:1.45;margin-top:-4px}
.nb-st{display:flex;align-items:center;gap:8px;flex:none;min-height:30px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.nb-st span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb-st .dot{background:var(--accent)}.nb-st .dot.idle{background:var(--dim)}
.nb-st.other{color:var(--accent)}
.nb-clr{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel-2);font-size:12px;font-weight:700}
.nb-vs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;flex:none}
.nb-v{width:46px;height:46px;border-radius:50%;border:0;background:var(--panel-2);font-weight:700;font-size:18px;padding:0;box-sizing:border-box}
.nb-v.on{background:var(--accent);color:var(--accent-ink)}
.nb-v.lv:not(.on){box-shadow:inset 0 0 0 2px var(--accent)}
.nb-blk{display:flex;gap:14px;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);font-family:var(--f-brand);font-weight:500;font-size:18px;line-height:1.42;white-space:pre-line;flex:none;transition:background .2s,border-color .2s}
.nb-blk.ch{font-style:italic;padding-left:44px}.nb-blk.ch:first-child{padding-left:14px}
.nb-vn{font-weight:700;color:var(--accent);min-width:16px;font-style:normal}
.nb-blk.live{border-color:var(--accent);background:var(--accent-soft)}
.nb-blk:active{opacity:.75}
.nb-nav{grid-template-columns:64px 1fr}
.nb-nav .btn{min-height:76px}
.nb-nav #nbBack{background:transparent;border-color:var(--line);color:var(--muted)}
.nb-nav #nbNext{gap:10px;font-size:20px;font-weight:800}
.nb-nav #nbNext small{font-size:14px;font-weight:700;opacity:.8}
.nb-nav #nbNext svg.i{width:28px;height:28px}
.nb-nav #nbNext:disabled{opacity:1;background:var(--panel-2);border-color:var(--line-2);color:var(--muted)}
.phone.hymns .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div class="stage"><main class="phone" id="phone" aria-live="polite"></main></div>
<script>
const ICON = {
  back:'<path d="m15 18-6-6 6-6"/>', fwd:'<path d="m9 18 6-6-6-6"/>',
  gear:'<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  proj:'<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/>',
  video:'<path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/>',
  hourglass:'<path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>',
  slides:'<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
  book:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  flag:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',
  wifi:'<path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.39"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><line x1="2" x2="22" y1="2" y2="22"/>',
  x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  rotate:'<path d="M12 5H6a2 2 0 0 0-2 2v3"/><path d="m9 8 3-3-3-3"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>',
  mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/>',
  square:'<rect width="18" height="18" x="3" y="3" rx="2"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  target:'<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
  stopshow:'<path d="M2 3h20"/><path d="M21 3v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V3"/><path d="m7 21 5-5 5 5"/><path d="m9.5 7 5 5"/><path d="m14.5 7-5 5"/>',
  swap:'<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  cast:'<path d="M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M2 12a9 9 0 0 1 8 8"/><path d="M2 16a5 5 0 0 1 4 4"/><line x1="2" x2="2.01" y1="20" y2="20"/>',
  ctrl:'<path d="M11.146 15.854a1.207 1.207 0 0 1 1.708 0l1.56 1.56A2 2 0 0 1 15 18.828V21a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-2.172a2 2 0 0 1 .586-1.414z"/><path d="M18.828 15a2 2 0 0 1-1.414-.586l-1.56-1.56a1.207 1.207 0 0 1 0-1.708l1.56-1.56A2 2 0 0 1 18.828 9H21a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1z"/><path d="M6.586 14.414A2 2 0 0 1 5.172 15H3a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2.172a2 2 0 0 1 1.414.586l1.56 1.56a1.207 1.207 0 0 1 0 1.708z"/><path d="M9 3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2.172a2 2 0 0 1-.586 1.414l-1.56 1.56a1.207 1.207 0 0 1-1.708 0l-1.56-1.56A2 2 0 0 1 9 5.172z"/>'
};

"use strict";
/* BGH LIVE Front: the phone remote. Served by the OBS plug-in on the front laptop (port 8650).
   Everything shown comes from the laptop; every tap is a request the laptop carries out. */
const LOGO = `<svg class="logo" viewBox="412 0 1096 1920" aria-hidden="true"><rect x="412" y="0" width="1096" height="1920" rx="182" fill="#F5B700"/><path d="M756 332h129v455h279v105H756z" fill="#132932"/><circle cx="960" cy="1392" r="207" fill="none" stroke="#132932" stroke-width="146"/></svg>`;
const BLEND = `<svg class="i blend" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="7"/><circle cx="15" cy="15" r="7"/></svg>`;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON[n] || ""}</svg>`;
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, "0")).join(":"); };
const ls = {get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }};

// Sent here from the hymn book to pair: go back to it afterwards
const nextPage = new URLSearchParams(location.search).get("next");
const S = {
  token:ls.get("bghFrontToken") || "", mode:ls.get("bghFrontMode"), turn:ls.get("bghFrontTurn") === "1",
  st:null, connected:false, offset:0, note:"", sheet:null, armed:null, armT:null, trOpen:false,
  nudgeUntil:0, nudgeT:null, pjBounce:false, toastT:null, x0:null, busy:false,
  shownSrc:"", loadingSrc:"", waiting:false, waitT:null, freshUntil:0, book:ls.get("bghFrontBook")
};
if(!["presenter", "controller", "hymns"].includes(S.mode)) S.mode = null;
if(S.book !== "nbh") S.book = null;
const now = () => Date.now() + S.offset;   // the laptop's clock
const mqLand = matchMedia("(orientation: landscape)");
const physLand = () => mqLand.matches;
const isLand = () => S.mode === "presenter" && (S.turn || physLand());
const isTurned = () => isLand() && S.turn && !physLand();
const live = () => S.connected && !!S.st;
(mqLand.addEventListener ? mqLand.addEventListener("change", () => render()) : mqLand.addListener(() => render()));

/* ---------------------------------------------------------------- talking to the laptop */
let es = null, retryT = null;
function connect(){
  clearTimeout(retryT);
  if(es){ es.close(); es = null; }
  if(!S.token || !S.mode) return;
  es = new EventSource(`/api/events?t=${encodeURIComponent(S.token)}&mode=${S.mode}`);
  es.addEventListener("hello", e => { const d = JSON.parse(e.data); S.offset = (d.now || Date.now()) - Date.now(); S.connected = true; render(); });
  es.addEventListener("state", e => { S.st = JSON.parse(e.data); S.connected = true; if(S.armed && S.st.program === S.armed) S.armed = null; render(); });
  es.addEventListener("hymn", e => {
    let d = null; try{ d = JSON.parse(e.data); }catch(x){}
    const n = d && d.key ? Object.assign({book:"soterio"}, d) : null;
    if((n && n.key) !== (hymnLive && hymnLive.key)){ hymnLive = n; if(S.mode === "hymns") render(); }
  });
  es.addEventListener("unpaired", () => unpair("This phone was removed on the front laptop. Pair it again to use it."));
  es.onopen = () => { S.connected = true; render(); };
  es.onerror = async () => {
    if(es && es.readyState !== 2){ if(S.connected){ S.connected = false; render(); } return; }   // the browser retries by itself
    S.connected = false; render();
    try{
      const r = await fetch("/api/cmd", {method:"POST", headers:{"Content-Type":"application/json", "Authorization":"Bearer " + S.token}, body:JSON.stringify({cmd:"ping"})});
      if(r.status === 401) return unpair("This phone isn't paired with the front laptop any more. Pair it again to use it.");
    }catch(e){}
    retryT = setTimeout(connect, 3000);
  };
}
document.addEventListener("visibilitychange", () => { if(!document.hidden && S.token && S.mode && (!es || es.readyState === 2)) connect(); });

function unpair(note){
  S.token = ""; S.st = null; S.note = note || ""; S.sheet = null;
  ls.set("bghFrontToken", null);
  if(es){ es.close(); es = null; }
  render();
}
async function cmd(c, args = {}){
  let r;
  try{ r = await fetch("/api/cmd", {method:"POST", headers:{"Content-Type":"application/json", "Authorization":"Bearer " + S.token}, body:JSON.stringify({cmd:c, args})}); }
  catch(e){ toast("Can't reach the front laptop. Check this phone is on the church Wi-Fi."); return {ok:false}; }
  if(r.status === 401){ unpair("This phone isn't paired with the front laptop any more. Pair it again to use it."); return {ok:false}; }
  let j = {ok:false}; try{ j = await r.json(); }catch(e){}
  if(!j.ok && j.error) toast(j.error);
  return j;
}

/* ---------------------------------------------------------------- drawing */
function headerHTML(){
  const pres = S.mode === "presenter", hy = S.mode === "hymns", st = S.st || {};
  const name = MODE_INFO[S.mode] ? MODE_INFO[S.mode].name : "Controller";
  return `<header class="top"><div class="bar1">
      <h1 class="brand">${LOGO}<span><b>BGH</b> Front</span></h1>
      <button class="mode-chip ${pres || hy ? "is-pres" : ""}" id="modeSwap" type="button" aria-label="${name} mode. Tap to change">${name}</button>
      <div class="conn ${live() ? "" : "lost"}" role="status" aria-label="${live() ? "Connected to Device" : "Reconnecting"}">${live() ? `<button class="conn-btn" id="connBtn" type="button" aria-label="Connected to Device">${BLEND}</button>` : `<i class="dot"></i><span>Reconnecting…</span>`}</div>
      ${pres && !physLand() ? `<button class="gear" id="turn" type="button" aria-pressed="${S.turn}" aria-label="${S.turn ? "Turn upright" : "Turn sideways"}">${ic("rotate")}</button>` : ""}
      ${pres || hy ? "" : `<button class="gear pj-btn${!st.proj && S.nudgeUntil > Date.now() ? " nudge" : ""}${S.pjBounce ? " bounce" : ""}" id="pjBtn" type="button" aria-pressed="${!!st.proj}" aria-label="${st.proj ? "Projecting on the OPTOMA projector. Tap to stop" : "Project Program on the OPTOMA projector"}">${ic("cast")}</button>`}
    </div></header>
  ${!live() ? `<div class="banner">${ic("wifi")}<div><b>Can't reach the front laptop.</b> Check OBS is open on it and this phone is on the church Wi-Fi. It reconnects by itself.</div></div>` : ""}`;
}

function render(){
  const P = $("phone");
  if(!S.token){ P.className = "phone"; P.innerHTML = pairHTML(); wirePair(); return; }
  if(!S.mode || S.picking){ P.className = "phone"; P.innerHTML = modePickHTML(); wireModePick(); return; }
  if(!es) connect();
  P.className = "phone" + (live() ? "" : " off") + (isLand() ? " land" : "") + (isTurned() ? " turned" : "") + (S.mode === "hymns" ? " hymns" : "");
  // Redrawing keeps the hymn list where it was scrolled to, and the search box being typed in
  const sc = $("nbScroll"), keepScroll = sc ? sc.scrollTop : null, typing = document.activeElement && document.activeElement.id === "nbQ";
  const caret = typing ? document.activeElement.selectionStart : 0;
  if(S.mode === "hymns" && S.book === "nbh") nbLoad();
  P.innerHTML = headerHTML() + (S.mode === "presenter" ? presenterHTML() : S.mode === "hymns" ? hymnsHTML() : controllerHTML())
    + (S.sheet ? S.sheet() : "") + `<div class="toast" id="toast" role="status" hidden></div>`;
  const sc2 = $("nbScroll");
  if(sc2){ if(NB.restore != null){ sc2.scrollTop = NB.restore; NB.restore = null; } else if(keepScroll != null && NB.view === NB.lastView) sc2.scrollTop = keepScroll; }
  NB.lastView = NB.view;
  if(typing && $("nbQ")){ $("nbQ").focus(); try{ $("nbQ").setSelectionRange(caret, caret); }catch(e){} }
  wire();
  if(S.mode === "presenter") preloadSlide();
}

// Loads the new slide's picture in the background, then swaps it in and flashes the outline
function preloadSlide(){
  const g = (S.st && S.st.slides) || {};
  if(!g.img) return;
  const want = `/api/img?t=${encodeURIComponent(S.token)}&k=cur&v=${g.v || 0}`;
  if(want === S.shownSrc || want === S.loadingSrc) return;
  S.loadingSrc = want;
  const im = new Image();
  im.onload = () => {
    if(S.loadingSrc !== want) return;
    S.loadingSrc = ""; S.shownSrc = want;
    clearTimeout(S.waitT);
    const wasWaiting = S.waiting; S.waiting = false;
    if(wasWaiting) S.freshUntil = Date.now() + 700;
    const pv = $("pvSlide"), el = pv && pv.querySelector("img");
    if(el){ el.src = want; pv.classList.remove("waiting"); if(wasWaiting){ pv.classList.remove("fresh"); void pv.offsetWidth; pv.classList.add("fresh"); } }
    else render();
  };
  im.onerror = () => { if(S.loadingSrc === want) S.loadingSrc = ""; };
  im.src = want;
}

/* Presenter: what's on the projector, what's next, and two big buttons */
function presenterHTML(){
  const st = S.st || {}, g = st.slides || {}, pp = g.app === "PowerPoint";
  const ar = g.ratio === "16:9" ? 16 / 9 : 4 / 3, wide = g.ratio === "16:9";
  const img = k => `/api/img?t=${encodeURIComponent(S.token)}&k=${k}&v=${g.v || 0}`;
  const want = g.img ? img("cur") : "";
  if(!want) S.shownSrc = "";
  else if(!S.shownSrc) S.shownSrc = want;   // the first picture: show it as it loads
  const shown = S.shownSrc || want;
  const cls = (S.waiting ? " waiting" : "") + (S.freshUntil > Date.now() ? " fresh" : "");
  const tag = st.proj && !st.presFront ? (pp ? "HIDDEN BEHIND OBS" : "OBS ON PROJECTOR") : "ON PROJECTOR";
  const empty = !st.pjFound ? `The ${esc(st.pjName || "OPTOMA")} projector isn't connected to the laptop.` : "Nothing is showing on the projector yet.";
  const atEnd = pp && g.total && g.n >= g.total, atStart = pp && g.n <= 1;
  const nextUp = !pp ? "" : `<div class="next-up">${g.next ? `<div class="thumb"><img src="${img("next")}" alt=""></div><div class="nt"><span>Up next</span><b>Slide ${g.n + 1}</b></div>`
    : `<div class="thumb"></div><div class="nt"><span>Up next</span><b>End of slideshow</b></div>`}</div>`;
  return `<div class="pres ctl" style="--ar:${ar}">
    <div class="pv-box"><div class="pv-slide${wide ? " wide" : ""}${cls}" id="pvSlide" role="img" aria-label="${pp ? `Slide ${g.n} of ${g.total}` : "The projector"}">
      ${g.img ? `<img src="${shown}" alt="">` : `<div class="pv-empty">${empty}</div>`}<span class="tag">${tag}</span></div></div>
    ${nextUp}
    <div class="pres-nav">
      <button class="btn" id="slBack" type="button" aria-label="Previous slide" ${atStart ? "disabled" : ""}>${ic("back")}</button>
      <button class="btn primary" id="slNext" type="button" aria-label="Next slide" ${atEnd ? "disabled" : ""}>${ic("fwd")}${pp && g.total ? `<span class="count tn">${g.n} / ${g.total}</span>` : ""}</button>
    </div>
  </div>`;
}

/* The three translator scenes live behind one Translator button; tapping it opens the three choices in its place.
   Every scene needs two taps: the first arms it for 3 seconds, the second switches. */
const isTr = s => / Translator$/.test(s.label);
const lang = s => s.label.replace(/ Translator$/, "");
const armed = s => S.armed === s.label && S.st && S.st.program !== s.label;
function translatorHTML(scenes){
  const tr = scenes.filter(isTr), on = tr.find(s => s.label === S.st.program);
  if(!S.trOpen) return `<button class="sc tr" id="trBtn" type="button" aria-expanded="false" aria-pressed="${!!on}">${ic("mic")}<span>Translator<small>${on ? `${esc(lang(on))} is on` : tr.map(lang).join(" · ")}</small></span>${ic("down")}</button>`;
  return `<div class="tr-open"><button class="tr-head" id="trBtn" type="button" aria-expanded="true">${ic("mic")}<span>Translator</span>${ic("x")}</button>
    <div class="tr-opts">${tr.map(s => `<button class="sc opt${armed(s) ? " armed" : ""}" type="button" data-sc="${esc(s.label)}" aria-pressed="${S.st.program === s.label}" ${s.here ? "" : "disabled"}><span>${esc(lang(s))}${armed(s) ? `<small class="arm">Tap again</small>` : !s.here ? "<small>Not in OBS</small>" : ""}</span></button>`).join("")}</div></div>`;
}
const SCENE_ICON = {"Baptism Cam":"video", "Black":"square"};
function controllerHTML(){
  const st = S.st || {program:"", scenes:[], rec:false, recT0:0};
  const scenes = st.scenes || [];
  return `<div class="scenes ctl" style="--rows:2">
    ${translatorHTML(scenes)}
    ${scenes.filter(s => !isTr(s)).map(s => `<button class="sc${armed(s) ? " armed" : ""}" type="button" data-sc="${esc(s.label)}" aria-pressed="${st.program === s.label}" ${s.here ? "" : "disabled"}>${ic(SCENE_ICON[s.label] || "video")}<span>${esc(s.label)}${armed(s) ? `<small class="arm">Tap again to switch</small>` : !s.here ? "<small>Not in OBS</small>" : ""}</span></button>`).join("")}
  </div>
  <div class="acts ctl">
    <button class="act rec" id="rec" type="button" aria-pressed="${!!st.rec}">
      <span class="t"><i class="rdot"></i>${st.rec ? `<span class="tn" id="recT">${fmt(now() - st.recT0)}</span>` : "Record"}</span>
      <small>${st.rec ? "Recording · tap to stop" : "Not recording"}</small>
    </button>
    <button class="act swap-btn${S.swapArmed ? " armed" : ""}" id="swapBtn" type="button" ${st.pjFound ? "" : "disabled"} aria-label="${S.swapArmed ? "Tap again to swap" : "Swap presentation and projection. " + (st.presFront ? "The presentation is in front" : "The projection is in front")}">
      <span class="${st.presFront ? "front" : ""}">${ic("proj")}</span>${ic("swap")}<span class="${st.presFront ? "" : "front"}">${ic("cast")}</span>
    </button>
  </div>`;
}

function wire(){
  $("modeSwap").onclick = () => { S.sheet = null; S.picking = true; render(); };
  if($("connBtn")) $("connBtn").onclick = () => toast("Connected to Device");
  if($("turn")) $("turn").onclick = () => { S.turn = !S.turn; ls.set("bghFrontTurn", S.turn ? "1" : null); render(); };
  if(S.mode === "hymns"){
    wireHymns();
  } else if(S.mode === "presenter"){
    const step = async d => {
      S.waiting = true; clearTimeout(S.waitT);
      const pv = $("pvSlide"); if(pv) pv.classList.add("waiting");
      S.waitT = setTimeout(() => { S.waiting = false; const p = $("pvSlide"); if(p) p.classList.remove("waiting"); }, 2500);
      const r = await cmd("slide", {d});
      if(!r.ok){ clearTimeout(S.waitT); S.waiting = false; render(); }
      return r;
    };
    $("slBack").onclick = () => step(-1);
    $("slNext").onclick = () => step(1);
    // Tap the slide's right side for next, the left side for back; or swipe
    const pv = $("pvSlide");
    pv.onpointerdown = e => { S.x0 = e.clientX; };
    pv.onpointerup = e => {
      const dx = S.x0 == null ? 0 : e.clientX - S.x0; S.x0 = null;
      if(Math.abs(dx) > 40) return step(dx < 0 ? 1 : -1);
      const r = pv.getBoundingClientRect();
      step(e.clientX - r.left > r.width / 3 ? 1 : -1);
    };
  } else {
    document.querySelectorAll("[data-sc]").forEach(b => b.onclick = async () => {
      const label = b.dataset.sc;
      if(S.st && S.st.program === label) return;   // already on
      clearTimeout(S.armT);
      if(S.armed !== label){ S.armed = label; render(); S.armT = setTimeout(() => { S.armed = null; render(); }, 3000); return; }
      S.armed = null; S.trOpen = false; render();
      const r = await cmd("scene", {label});
      // Switched a scene but OBS isn't on the projector: the projector button pulses for 10 seconds
      if(r.ok && S.st && !S.st.proj){ S.nudgeUntil = Date.now() + 10000; render(); clearTimeout(S.nudgeT); S.nudgeT = setTimeout(render, 10050); }
    });
    $("trBtn").onclick = () => { S.trOpen = !S.trOpen; render(); };
    $("pjBtn").onclick = async () => {
      if(S.st && S.st.proj){ S.sheet = pjStopHTML; render(); return; }
      const r = await cmd("proj", {on:true});
      if(r.ok){ S.nudgeUntil = 0; S.pjBounce = true; render(); S.pjBounce = false; toast(`Projecting on the ${(S.st && S.st.pjName) || "OPTOMA"} projector.`); }
    };
    // Double tap to swap: the first tap arms it for 3 seconds, the second swaps
    $("swapBtn").onclick = async () => {
      clearTimeout(S.swapT);
      if(!S.swapArmed){ S.swapArmed = true; render(); S.swapT = setTimeout(() => { S.swapArmed = false; render(); }, 3000); return; }
      S.swapArmed = false;
      const st = S.st || {}, toPres = !st.presFront, starting = !toPres && !st.proj;
      render();
      const r = await cmd("swap");
      if(r.ok) toast(toPres ? "The presentation is in front." : starting ? "Projecting the Black scene, in front of the presentation." : "OBS's projection is in front.");
    };
    $("rec").onclick = async () => {
      if(S.st && S.st.rec){ S.sheet = stopHTML; render(); return; }
      const r = await cmd("rec", {on:true});
      if(r.ok) toast("Recording started.");
    };
  }
  if(S.sheet === stopHTML) wireStop();
  if(S.sheet === pjStopHTML) wirePjStop();
  if(S.sheet === swapHTML) wireSwap();
  if(S.sheet === endShowHTML) wireEndShow();
}

function endShowHTML(){
  return `<div class="scrim center" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="esH">
    <h3 id="esH">Are you sure you want to stop presenting?</h3>
    <p>The slideshow will close on the ${esc((S.st && S.st.pjName) || "OPTOMA")} projector.</p>
    <div class="row2"><button class="btn quiet" id="esNo" type="button">Keep presenting</button><button class="btn primary" id="esYes" type="button">Stop presenting</button></div>
  </div></div>`;
}
function wireEndShow(){
  const close = () => { S.sheet = null; render(); };
  $("esNo").onclick = close;
  $("scrim").onclick = e => { if(e.target.id === "scrim") close(); };
  $("esYes").onclick = async () => { S.sheet = null; render(); const r = await cmd("endshow"); if(r.ok) toast("Stopped presenting."); };
}
/* Swap which is in front on the projector: the presentation or OBS's projection */
function swapHTML(){
  const st = S.st || {}, presFront = !!st.presFront;
  return `<div class="scrim center" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="swH">
    <div class="swap-icons" aria-hidden="true">
      <span class="${presFront ? "front" : ""}">${ic("proj")}</span>${ic("swap")}<span class="${presFront ? "" : "front"}">${ic("cast")}</span>
    </div>
    <h3 id="swH">Are you sure?</h3>
    <p>${presFront ? (st.proj ? "OBS's projection will go in front of the presentation." : "OBS will start projecting on the Black scene, in front of the presentation.") : "The presentation will go in front of OBS's projection."}</p>
    <div class="row2"><button class="btn quiet" id="swNo" type="button">Cancel</button><button class="btn primary" id="swYes" type="button">Swap</button></div>
  </div></div>`;
}
function wireSwap(){
  const close = () => { S.sheet = null; render(); };
  $("swNo").onclick = close;
  $("scrim").onclick = e => { if(e.target.id === "scrim") close(); };
  $("swYes").onclick = async () => {
    const toPres = !(S.st && S.st.presFront), starting = !toPres && !(S.st && S.st.proj);
    S.sheet = null; render();
    const r = await cmd("swap");
    if(r.ok) toast(toPres ? "The presentation is in front." : starting ? "Projecting the Black scene, in front of the presentation." : "OBS's projection is in front.");
  };
}
function pjStopHTML(){
  return `<div class="scrim center" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pjH">
    <h3 id="pjH">Are you sure you want to stop projecting?</h3>
    <p>OBS will close on the ${esc((S.st && S.st.pjName) || "OPTOMA")} projector and the slideshow will show again.</p>
    <div class="row2"><button class="btn quiet" id="pjNo" type="button">Keep projecting</button><button class="btn primary" id="pjYes" type="button">Stop projecting</button></div>
  </div></div>`;
}
function wirePjStop(){
  const close = () => { S.sheet = null; render(); };
  $("pjNo").onclick = close;
  $("scrim").onclick = e => { if(e.target.id === "scrim") close(); };
  $("pjYes").onclick = async () => { S.sheet = null; render(); const r = await cmd("proj", {on:false}); if(r.ok) toast("Stopped projecting."); };
}
/* Stopping a recording asks first: a stray tap would cut the sermon in half */
function stopHTML(){
  const st = S.st || {};
  return `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="stopH">
    <h3 id="stopH">Stop recording?</h3>
    <p>OBS has been recording for ${fmt(now() - (st.recT0 || now()))}. Stopping saves the file on the front laptop.</p>
    <div class="row2"><button class="btn quiet" id="stopNo" type="button">Keep recording</button><button class="btn danger" id="stopYes" type="button">Stop recording</button></div>
  </div></div>`;
}
function wireStop(){
  $("stopNo").onclick = () => { S.sheet = null; render(); };
  $("scrim").onclick = e => { if(e.target.id === "scrim"){ S.sheet = null; render(); } };
  $("stopYes").onclick = async () => { S.sheet = null; render(); const r = await cmd("rec", {on:false}); if(r.ok) toast("Recording saved on the front laptop."); };
}

/* ---------------------------------------------------------------- Hymns
   Two hymn books. The Soterio Hymn Collection opens from this laptop at /hymns, where its own Presenter Mode
   shows verses. The New Believers Hymn Book (data/new-believers.json) lives here in the remote. Either way the
   verse goes on /hymn-screen in OBS, and showing one switches OBS to the Hymns scene. */
const NB = {data:null, loading:false, err:"", view:"list", q:"", n:null, vi:{}, used:false, scroll:0, restore:null, lastView:null};
let hymnLive = null;   // the verse on the screen, from any phone: {key, book, n, i, k, num, label, ...}
const BOOKS = {
  soterio:{name:"The Soterio Hymn Collection", text:"Open the hymn book and use its Presenter Mode"},
  nbh:{name:"The New Believers Hymn Book", text:"700 hymns, shown from this remote"}
};
async function nbLoad(){
  if(NB.data || NB.loading) return;
  NB.loading = true; NB.err = "";
  try{ const r = await fetch("/new-believers.json"); if(!r.ok) throw 0; NB.data = await r.json(); }
  catch(e){ NB.err = "Can't load The New Believers Hymn Book from the front laptop."; }
  NB.loading = false; render();
}
const nbHymn = n => NB.data && NB.data.find(h => h.n === n);
// A chorus right after verse 1 is sung after every verse, so it goes with each verse. Elsewhere it's its own "C".
function nbItems(h){
  const b = h.b, fv = b.findIndex(x => x.k === "v"), ci = b.findIndex(x => x.k === "c");
  const rep = ci >= 0 && fv >= 0 && (ci === fv + 1 || ci < fv), main = rep ? b[ci].l : null, out = [];
  b.forEach((x, i) => {
    if(x.k === "c"){ if(!rep || i < fv) out.push({label:"C", c:true, text:x.l, chorus:null}); return; }
    const nx = b[i + 1];
    out.push({label:x.n, c:false, text:x.l, chorus:rep ? (nx && nx.k === "c" ? nx.l : main) : null});
  });
  return out;
}
const nbSeq = P => { const q = []; P.forEach((it, i) => { q.push([i, "v"]); if(it.chorus) q.push([i, "c"]); }); return q; };
const nbLiveHere = h => hymnLive && hymnLive.book === "nbh" && hymnLive.n === h.n ? hymnLive : null;
function nbNext(h, d){
  const P = nbItems(h), q = nbSeq(P), lk = nbLiveHere(h), vi = NB.vi[h.n] || 0;
  const at = lk ? q.findIndex(x => x[0] === lk.i && x[1] === lk.k) : q.findIndex(x => x[0] === vi) - (d > 0 ? 1 : 0);
  return q[at + d] || null;
}
const nbName = (P, s) => !s ? "" : s[1] === "c" || P[s[0]].c ? "Chorus" : "Verse " + P[s[0]].label;
async function nbShow(h, i, k){
  const it = nbItems(h)[i]; if(!it) return;
  const ch = k === "c" || it.c, text = k === "c" ? it.chorus : it.text;
  const show = {key:`nbh:${h.n}:${i}:${k}`, book:"nbh", n:h.n, i, k, num:String(h.n), title:h.t,
    label:ch ? "Chorus" : "Verse " + it.label, chorus:ch, text};
  hymnLive = show; NB.vi[h.n] = i; NB.used = true; render();
  const r = await cmd("hymn", {show});
  if(!r.ok) render();
}
function nbClear(){ if(!hymnLive) return; hymnLive = null; render(); cmd("hymn", {}); }
// Done with the hymn: clear it, and OBS goes back to the scene from before
function nbDone(){ if(!NB.used && !hymnLive) return; NB.used = false; hymnLive = null; cmd("hymnback"); }
const liveLabel = () => !hymnLive ? "" : (hymnLive.book === "nbh" ? "Hymn " : "") + hymnLive.num + " · " + hymnLive.label;

function hymnsHTML(){
  if(S.book !== "nbh") return `<div class="nb books ctl"><h2 class="nb-q">Which hymn book?</h2>
    <div class="modes">${Object.entries(BOOKS).map(([k, b]) => `<button class="mode-card book" type="button" data-book="${k}"><i class="bico ${k}" aria-hidden="true"></i><b>${b.name}</b><span>${b.text}</span></button>`).join("")}</div>
    ${hymnLive ? `<div class="nb-st"><i class="dot"></i><span>On screen: ${esc(liveLabel())}</span><button class="nb-clr" id="nbClr" type="button">Clear screen</button></div>` : ""}</div>`;
  if(!NB.data) return `<div class="nb"><div class="nb-bar"><button class="gear" id="nbBooks" type="button" aria-label="Hymn books">${ic("back")}</button><b class="nb-bk">${BOOKS.nbh.name}</b></div>
    <div class="pv-empty" style="position:static;flex:1">${NB.err ? esc(NB.err) + `<br><br><button class="btn" id="nbRetry" type="button">Try again</button>` : "Opening the hymn book…"}</div></div>`;
  return NB.view === "hymn" && nbHymn(NB.n) ? nbHymnHTML(nbHymn(NB.n)) : nbListHTML();
}
function nbMatch(){
  const q = NB.q.trim().toLowerCase();
  if(!q) return NB.data;
  if(/^\d+$/.test(q)) return NB.data.filter(h => String(h.n).startsWith(q));
  const words = q.split(/\s+/);
  const hay = h => (h._h = h._h || (h.t + " " + (h.words || "") + " " + (h.tune || "") + " " + h.b.map(x => x.l).join(" ")).toLowerCase().replace(/[’']/g, "'"));
  return NB.data.filter(h => words.every(w => hay(h).includes(w.replace(/[’']/g, "'"))));
}
function nbListHTML(){
  const r = nbMatch(), lv = hymnLive && hymnLive.book === "nbh" ? hymnLive.n : null;
  return `<div class="nb"><div class="nb-bar"><button class="gear" id="nbBooks" type="button" aria-label="Hymn books">${ic("back")}</button><b class="nb-bk">${BOOKS.nbh.name}</b></div>
    <input class="txt nb-search" id="nbQ" type="search" inputmode="search" placeholder="Number, title or words" value="${esc(NB.q)}" autocomplete="off" aria-label="Search The New Believers Hymn Book">
    ${hymnLive ? `<div class="nb-st"><i class="dot"></i><span>On screen: ${esc(liveLabel())}</span><button class="nb-clr" id="nbClr" type="button">Clear screen</button></div>` : ""}
    <div class="nb-scroll" id="nbScroll">${r.length ? r.slice(0, 700).map(h => `<button class="nb-row${h.n === lv ? " live" : ""}" type="button" data-n="${h.n}"><span class="nb-n">${h.n}</span><span class="nb-t"><b>${esc(h.t)}</b><small>${esc((h.b[0] && h.b[0].l.split("\n")[0]) || "")}</small></span>${h.n === lv ? `<i class="nb-tag">On screen</i>` : ""}</button>`).join("")
      : `<div class="pv-empty" style="position:static;padding:40px 10px">No hymns match “${esc(NB.q)}”.</div>`}</div></div>`;
}
function nbHymnHTML(h){
  const P = nbItems(h), lk = nbLiveHere(h), i = Math.min(NB.vi[h.n] || 0, P.length - 1), it = P[i] || {text:"", label:"1"};
  const on = k => lk && lk.i === i && lk.k === k ? " live" : "", nx = nbNext(h, 1), pv = nbNext(h, -1);
  const meta = [h.words && "Words: " + h.words, h.music && "Music: " + h.music, [h.tune, h.meter].filter(Boolean).join(" · ")].filter(Boolean);
  const other = hymnLive && !lk;
  return `<div class="nb hy">
    <div class="nb-bar"><button class="gear" id="nbList" type="button" aria-label="All hymns">${ic("back")}</button>
      <div class="nb-ttl"><span class="nb-n">${h.n}</span><b>${esc(h.t)}</b></div></div>
    ${meta.length ? `<div class="nb-meta">${meta.map(esc).join("<br>")}</div>` : ""}
    <div class="nb-st${other ? " other" : ""}"><i class="dot${hymnLive ? "" : " idle"}"></i><span>${hymnLive ? "On screen: " + esc(other ? liveLabel() : lk.label) : "Screen shows the QR code"}</span>${hymnLive ? `<button class="nb-clr" id="nbClr" type="button">Clear screen</button>` : ""}</div>
    <div class="nb-vs ctl" role="group" aria-label="Verses">${P.map((x, j) => `<button class="nb-v${j === i ? " on" : ""}${lk && lk.i === j ? " lv" : ""}" type="button" data-vi="${j}" aria-label="${x.c ? "Chorus" : "Verse " + x.label}">${esc(x.label)}</button>`).join("")}</div>
    <div class="nb-scroll ctl" id="nbScroll">
      <button class="nb-blk${it.c ? " ch" : ""}${on("v")}" id="nbV" type="button">${it.c ? "" : `<span class="nb-vn">${esc(it.label)}</span>`}<span>${esc(it.text)}</span></button>
      ${it.chorus ? `<button class="nb-blk ch${on("c")}" id="nbC" type="button"><span>${esc(it.chorus)}</span></button>` : ""}
    </div>
    <div class="pres-nav nb-nav ctl">
      <button class="btn" id="nbBack" type="button" aria-label="Back: ${esc(nbName(P, pv) || "start of the hymn")}" ${pv ? "" : "disabled"}>${ic("back")}</button>
      <button class="btn primary" id="nbNext" type="button" ${nx ? "" : "disabled"}><span>${nx ? (lk ? "Next" : "Show") : "End of hymn"}</span>${nx ? `<small>${esc(nbName(P, nx))}</small>` : ""}${ic("fwd")}</button>
    </div></div>`;
}
function wireHymns(){
  document.querySelectorAll("[data-book]").forEach(b => b.onclick = () => {
    if(b.dataset.book === "soterio"){ location.href = "/hymns"; return; }
    S.book = "nbh"; ls.set("bghFrontBook", "nbh"); NB.view = "list"; nbLoad(); render();
  });
  if($("nbClr")) $("nbClr").onclick = nbClear;
  if($("nbRetry")) $("nbRetry").onclick = () => { NB.err = ""; nbLoad(); render(); };
  if($("nbBooks")) $("nbBooks").onclick = () => { nbDone(); S.book = null; ls.set("bghFrontBook", null); render(); };
  const q = $("nbQ");
  if(q) q.oninput = () => { NB.q = q.value; const p = q.selectionStart; NB.scroll = 0; NB.restore = 0; render(); const n = $("nbQ"); n.focus(); try{ n.setSelectionRange(p, p); }catch(e){} };
  document.querySelectorAll("[data-n]").forEach(b => b.onclick = () => { NB.scroll = $("nbScroll").scrollTop; NB.view = "hymn"; NB.n = +b.dataset.n; if(NB.vi[NB.n] == null) NB.vi[NB.n] = 0; render(); });
  const h = S.book === "nbh" && NB.view === "hymn" && $("nbList") && nbHymn(NB.n);
  if(!h) return;
  $("nbList").onclick = () => { nbDone(); NB.view = "list"; NB.restore = NB.scroll; render(); };
  document.querySelectorAll("[data-vi]").forEach(b => b.onclick = () => nbShow(h, +b.dataset.vi, "v"));
  $("nbV").onclick = () => nbShow(h, NB.vi[h.n] || 0, "v");
  if($("nbC")) $("nbC").onclick = () => nbShow(h, NB.vi[h.n] || 0, "c");
  const step = d => { const s = nbNext(h, d); if(s) nbShow(h, s[0], s[1]); };
  $("nbNext").onclick = () => step(1);
  $("nbBack").onclick = () => step(-1);
}

/* After pairing, each phone says how it will be used */
const MODE_INFO = {
  presenter:{icon:"slides", name:"Presenter", text:"Manage Slideshow"},
  controller:{icon:"ctrl", name:"Controller", text:"Manage Live Translator, Baptism Cam"},
  hymns:{icon:"book", name:"Hymns", text:"Show hymn verses on the projector"}
};
function modePickHTML(){
  return `<div class="pair">
    <h1 class="brand">${LOGO}<span><b>BGH</b> Front</span></h1>
    <h2>How will you use this phone?</h2>
    <div class="modes">${Object.entries(MODE_INFO).map(([k, m]) => `<button class="mode-card" type="button" data-mode="${k}" aria-pressed="${S.mode === k}">${ic(m.icon)}<b>${m.name}</b><span>${m.text}</span></button>`).join("")}</div>
  </div><div class="toast" id="toast" role="status" hidden></div>`;
}
function wireModePick(){
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    const m = b.dataset.mode;
    S.picking = false;
    if(m === S.mode) render(); else setMode(m);
  });
}
function setMode(m){
  if(S.mode === "hymns" && m !== "hymns") nbDone();
  if(m === "hymns"){ S.book = null; ls.set("bghFrontBook", null); }
  S.mode = m; ls.set("bghFrontMode", m); S.sheet = null; S.armed = null; S.trOpen = false;
  if(es && es.readyState !== 2) cmd("mode", {mode:m}); else connect();
  render();
}

/* Pairing: the QR code in OBS pairs by itself; otherwise type the 3-digit code shown there */
function pairHTML(){
  return `<div class="pair">
    <h1 class="brand">${LOGO}<span><b>BGH</b> Front</span></h1>
    <h2>Pair this phone with the front laptop</h2>
    ${S.note ? `<div class="banner">${ic("wifi")}<div>${esc(S.note)}</div></div>` : ""}
    <p>On the laptop, find the <b>BGH LIVE Front</b> panel in OBS. Scan its QR code with this phone's camera, or type the code it shows.</p>
    <div class="code">${[0, 1, 2].map(k => `<input id="c${k}" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit ${k + 1}">`).join("")}</div>
    <div class="err" id="pairErr" role="alert"></div>
  </div><div class="toast" id="toast" role="status" hidden></div>`;
}
async function tryPair(body){
  if(S.busy) return;
  S.busy = true;
  let j = {};
  try{ const r = await fetch("/api/pair", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}); j = await r.json(); }
  catch(e){ S.busy = false; if($("pairErr")) $("pairErr").textContent = "Can't reach the front laptop. Check this phone is on the church Wi-Fi and OBS is open."; return; }
  S.busy = false;
  if(j.token){ S.token = j.token; S.note = ""; ls.set("bghFrontToken", j.token); if(nextPage === "hymns") return location.replace("/hymns"); history.replaceState(null, "", "/"); render(); toast("Paired with the front laptop."); return; }
  const msg = j.code === "LOCKED" ? `Too many wrong codes. Try again in ${Math.ceil((j.wait || 300) / 60)} minutes.`
    : body.key ? "That QR code has already been used. Scan the new one in OBS, or type the code."
    : "That code didn't match. Check the code in OBS and try again.";
  if($("pairErr")) $("pairErr").textContent = msg;
  else { S.note = msg; render(); }
}
function wirePair(){
  const ins = [0, 1, 2].map(k => $("c" + k));
  ins.forEach((el, k) => {
    el.oninput = () => {
      const d = el.value.replace(/\D/g, "");
      if(d.length > 1){ d.slice(0, 3).split("").forEach((x, i) => { if(ins[k + i]) ins[k + i].value = x; }); }   // pasted or autofilled
      else el.value = d;
      const nx = ins.find(x => !x.value); if(nx && el.value) nx.focus();
      const code = ins.map(x => x.value).join("");
      if(code.length === 3){ tryPair({code}); ins.forEach(x => x.value = ""); ins[0].focus(); }
    };
    el.onkeydown = e => { if(e.key === "Backspace" && !el.value && k > 0) ins[k - 1].focus(); };
  });
}

function toast(msg){
  const t = $("toast"); if(!t) return;
  t.textContent = msg; t.hidden = false;
  clearTimeout(S.toastT); S.toastT = setTimeout(() => { const x = $("toast"); if(x) x.hidden = true; }, 2600);
}

// The recording timer ticks without redrawing everything
setInterval(() => { const t = $("recT"); if(t && S.st && S.st.rec) t.textContent = fmt(now() - S.st.recT0); }, 1000);

// Opened from the QR code in OBS: pair straight away
const qrKey = new URLSearchParams(location.search).get("k");
if(nextPage === "hymns" && S.token) location.replace("/hymns");   // already paired: back to the hymn book
else if(qrKey && !S.token){ render(); tryPair({key:qrKey}); }
else { if(qrKey) history.replaceState(null, "", "/"); render(); }
</script>
